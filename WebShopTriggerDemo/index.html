<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voltex Supply – Sign In</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-logo">
            <h1>Volt<span>ex</span> Supply</h1>
            <p>Electrical &amp; Industrial Materials</p>
        </div>

        <div id="login-error" class="login-error" role="alert">
            Invalid email or password. Please try again.
        </div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required
                />
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <p style="text-align:center;margin-bottom:.75rem;font-size:.85rem;">
            <a href="landing.html">← Back to home</a>
        </p>

        <div class="login-hint">
            <strong>Demo accounts</strong><br />
            john.smith@demo.com &nbsp;|&nbsp; sarah.jones@demo.com &nbsp;|&nbsp; guest@demo.com<br />
            Password: <code>Demo1234!</code>
        </div>

    </div>
</div>

<script src="js/auth.js"></script>
<script>
    // Redirect if already logged in
    if (getSession()) window.location.href = 'shop.html';

    document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const email    = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errEl    = document.getElementById('login-error');

        const user = login(email, password);
        if (user) {
            errEl.classList.remove('visible');
            window.location.href = 'shop.html';
        } else {
            errEl.classList.add('visible');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    });
</script>

</body>
</html>
